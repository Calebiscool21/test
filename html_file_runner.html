<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Runner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">

    <!-- Header / Control Bar -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600 rounded-lg text-white shadow-md shadow-indigo-500/20">
                <i data-lucide="play-circle" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-100 text-sm md:text-base leading-tight flex items-center gap-2">
                    HTML File Runner
                    <span id="fileNameBadge" class="hidden text-xs font-normal font-mono bg-slate-800 text-indigo-400 border border-slate-700 px-2 py-0.5 rounded-full"></span>
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Open File Button -->
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-semibold py-1.5 px-3.5 rounded-lg flex items-center gap-2 shadow-lg shadow-indigo-600/25 transition">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
                <span>Open HTML File</span>
                <input type="file" id="fileInput" accept=".html,.htm" class="hidden">
            </label>

            <!-- Reload Preview -->
            <button id="btnReload" title="Reload File" disabled class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded-lg transition">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>

            <!-- View Source Modal Toggle -->
            <button id="btnSource" title="View Source Code" disabled class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded-lg transition">
                <i data-lucide="code" class="w-4 h-4"></i>
            </button>

            <!-- Fullscreen Preview -->
            <button id="btnFullscreen" title="Fullscreen Preview" disabled class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent rounded-lg transition">
                <i data-lucide="maximize-2" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative overflow-hidden flex items-center justify-center bg-slate-900" id="dropArea">

        <!-- Initial Drag & Drop Launcher Screen -->
        <div id="uploadPrompt" class="flex flex-col items-center justify-center p-8 text-center max-w-md border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl bg-slate-950/60 transition cursor-pointer group">
            <div class="w-16 h-16 rounded-2xl bg-slate-800 group-hover:bg-indigo-600/10 text-indigo-400 flex items-center justify-center mb-4 transition border border-slate-700 group-hover:border-indigo-500/50">
                <i data-lucide="file-up" class="w-8 h-8"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-100 mb-1">Drop your HTML file here</h2>
            <p class="text-xs text-slate-400 mb-4">Select any local <code class="text-indigo-400">.html</code> or <code class="text-indigo-400">.htm</code> file to run instantly</p>
            <button onclick="document.getElementById('fileInput').click()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium text-xs py-2 px-4 rounded-lg transition">
                Browse Computer
            </button>
        </div>

        <!-- HTML Viewer Frame -->
        <iframe id="previewFrame" class="w-full h-full border-0 bg-white hidden" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>

        <!-- Drop Overlay indicator -->
        <div id="dropOverlay" class="absolute inset-0 bg-indigo-950/90 border-4 border-dashed border-indigo-500 z-40 flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-150">
            <i data-lucide="file-up" class="w-16 h-16 text-indigo-400 animate-bounce mb-2"></i>
            <h2 class="text-xl font-bold text-white">Release to Run File</h2>
        </div>
    </main>

    <!-- Source Code View Modal -->
    <div id="sourceModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-4xl w-full h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="h-12 border-b border-slate-800 px-4 flex items-center justify-between bg-slate-950">
                <div class="flex items-center gap-2">
                    <i data-lucide="file-code" class="w-4 h-4 text-indigo-400"></i>
                    <span id="modalTitle" class="text-xs font-mono text-slate-300">Source Code</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btnCopySource" class="text-xs text-slate-400 hover:text-slate-100 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1 rounded transition flex items-center gap-1">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Code
                    </button>
                    <button id="btnCloseModal" class="p-1 text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded transition">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 p-4 overflow-auto bg-slate-950">
                <pre><code id="sourceCodeText" class="font-mono text-xs text-indigo-300 whitespace-pre-wrap break-all"></code></pre>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let currentContent = '';
        let currentFileName = '';

        window.onload = () => {
            lucide.createIcons();
            setupEventListeners();
        };

        function loadHTMLContent(content, filename) {
            currentContent = content;
            currentFileName = filename;

            const previewFrame = document.getElementById('previewFrame');
            const uploadPrompt = document.getElementById('uploadPrompt');
            const fileNameBadge = document.getElementById('fileNameBadge');

            // Hide drag-prompt, show iframe
            uploadPrompt.classList.add('hidden');
            previewFrame.classList.remove('hidden');

            // Set badge name
            fileNameBadge.innerText = filename;
            fileNameBadge.classList.remove('hidden');

            // Enable control buttons
            document.getElementById('btnReload').disabled = false;
            document.getElementById('btnSource').disabled = false;
            document.getElementById('btnFullscreen').disabled = false;

            // Render into iframe using Blob URL
            const blob = new Blob([content], { type: 'text/html' });
            previewFrame.src = URL.createObjectURL(blob);
        }

        function setupEventListeners() {
            const fileInput = document.getElementById('fileInput');
            const dropArea = document.getElementById('dropArea');
            const uploadPrompt = document.getElementById('uploadPrompt');
            const dropOverlay = document.getElementById('dropOverlay');

            // File selection
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => loadHTMLContent(event.target.result, file.name);
                    reader.readAsText(file);
                }
            });

            // Drag and Drop
            uploadPrompt.addEventListener('click', () => fileInput.click());

            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropOverlay.classList.remove('opacity-0');
            });

            window.addEventListener('dragleave', (e) => {
                if (e.clientX === 0 && e.clientY === 0) {
                    dropOverlay.classList.add('opacity-0');
                }
            });

            window.addEventListener('drop', (e) => {
                e.preventDefault();
                dropOverlay.classList.add('opacity-0');
                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.name.endsWith('.html') || file.name.endsWith('.htm')) {
                        const reader = new FileReader();
                        reader.onload = (event) => loadHTMLContent(event.target.result, file.name);
                        reader.readAsText(file);
                    }
                }
            });

            // Reload Frame
            document.getElementById('btnReload').addEventListener('click', () => {
                if (currentContent && currentFileName) {
                    loadHTMLContent(currentContent, currentFileName);
                }
            });

            // Fullscreen Frame
            document.getElementById('btnFullscreen').addEventListener('click', () => {
                const previewFrame = document.getElementById('previewFrame');
                if (previewFrame.requestFullscreen) previewFrame.requestFullscreen();
                else if (previewFrame.webkitRequestFullscreen) previewFrame.webkitRequestFullscreen();
            });

            // Source Code Modal
            const sourceModal = document.getElementById('sourceModal');
            document.getElementById('btnSource').addEventListener('click', () => {
                document.getElementById('sourceCodeText').textContent = currentContent;
                document.getElementById('modalTitle').textContent = `Source: ${currentFileName}`;
                sourceModal.classList.remove('hidden');
            });

            document.getElementById('btnCloseModal').addEventListener('click', () => {
                sourceModal.classList.add('hidden');
            });

            document.getElementById('btnCopySource').addEventListener('click', () => {
                navigator.clipboard.writeText(currentContent);
                alert('Source code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
